# Crypto platform — Phase 1–3 Docker Compose stack.
#
# Services:
#   kafka         - Apache Kafka (KRaft mode, no ZooKeeper)  apache/kafka:latest
#   kafka-ui      - Provectus Kafka UI  http://localhost:8080
#   minio         - MinIO S3-compatible object storage  http://localhost:9001
#   mc-init       - One-shot init: creates bronze / silver / gold buckets
#   clickhouse    - ClickHouse OLAP engine  http://localhost:8123
#
# Usage:
#   docker compose up -d
#   docker compose stop kafka-ui   # free RAM when not needed

x-airflow-env: &airflow-env
  # 1. Airflow Core & Database Authentication
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /tmp/simple_auth_passwords.json

  # 2. Data Governance & Lineage (OpenLineage)
  AIRFLOW__OPENLINEAGE__DISABLED: "false"
  AIRFLOW__OPENLINEAGE__URL: "http://openmetadata:8585/api/v1/openlineage"
  AIRFLOW__OPENLINEAGE__NAMESPACE: "crypto-platform"

  # 3. Container Inter-Service Endpoints
  PYTHONPATH: /opt/airflow/app/src
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PORT: "8123"
  MINIO_ENDPOINT: http://minio:9000
  CUBE_API_URL: http://cube:4000

  # 4. Task Execution Runtime Paths
  DBT_LOG_PATH: /tmp/dbt_logs
  DBT_TARGET_PATH: /tmp/dbt_target
  DBT_ALLOW_EXPERIMENTAL_ADAPTERS: "true"
  EXPORT_OUTPUT_DIR: /tmp/exports
  LINEAGE_OUTPUT_DIR: /tmp/exports

  # 5. PySpark Execution Environment
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

  # 6. Airflow Metrics & Observability (StatsD)
  AIRFLOW__METRICS__STATSD_ON: "true"
  AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
  AIRFLOW__METRICS__STATSD_PORT: "8125"
  AIRFLOW__METRICS__STATSD_PREFIX: airflow

services:

  # --------------------------------------------------------------------------
  # Apache Kafka — KRaft mode, single combined broker/controller node
  # --------------------------------------------------------------------------
  kafka:
    image: apache/kafka:latest
    container_name: platform-kafka
    hostname: kafka
    ports:
      - "9094:9094"   # EXTERNAL listener — host access
    environment:
      # Node identity
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"

      # Cluster ID (stable UUID — regenerate with kafka-storage.sh random-uuid)
      CLUSTER_ID: "WkdnTb4jQ3aO-0B24ZvsMQ"

      # Controller quorum
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      # Listeners: INTERNAL (docker) + EXTERNAL (host) + CONTROLLER
      KAFKA_LISTENERS: "INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"

      # JVM heap — capped for 7-8 GB usable RAM machine
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"

      # Topic defaults
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"

      # Retention — 24 h keeps disk usage manageable during dev
      KAFKA_LOG_RETENTION_HOURS: "24"
      KAFKA_LOG_SEGMENT_BYTES: "268435456"   # 256 MB segments

    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - platform-net
    healthcheck:
      test:
        - "CMD-SHELL"
        - "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Kafka UI — lightweight broker observability
  # --------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: platform-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - platform-net
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # MinIO — S3-compatible local lake storage
  # --------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: platform-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Admin console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - platform-net
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "-f"
        - "http://localhost:9000/minio/health/live"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # mc-init — one-shot MinIO Client that creates the medallion buckets
  # --------------------------------------------------------------------------
  mc-init:
    image: minio/mc:latest
    container_name: platform-mc-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/bronze &&
        mc mb --ignore-existing local/silver &&
        mc mb --ignore-existing local/gold &&
        echo 'Buckets ready: bronze, silver, gold' &&
        exit 0
      "
    networks:
      - platform-net

  # --------------------------------------------------------------------------
  # ClickHouse — columnar OLAP engine
  # --------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:head-alpine
    container_name: platform-clickhouse
    ports:
      - "8123:8123"   # HTTP interface (clickhouse-connect, dbt)
      - "9009:9009"   # Native TCP (ClickHouse-to-ClickHouse replication)
    environment:
      CLICKHOUSE_DB: gold
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/config.d/custom-config.xml:/etc/clickhouse-server/config.d/custom-config.xml
      - ./infra/clickhouse/users.d/custom-users.xml:/etc/clickhouse-server/users.d/custom-users.xml
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    mem_limit: 2048m
    networks:
      - platform-net
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Cube — Semantic Layer
  # --------------------------------------------------------------------------
  cube:
    image: cubejs/cube:latest
    container_name: platform-cube
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "4000:4000"   # REST API + Playground UI
      - "15432:15432" # SQL API (Postgres wire protocol)
    environment:
      CUBEJS_DEV_MODE: "true"
      CUBEJS_DB_TYPE: clickhouse
      CUBEJS_DB_HOST: clickhouse
      CUBEJS_DB_PORT: "8123"
      CUBEJS_DB_NAME: gold
      CUBEJS_DB_USER: default
      CUBEJS_DB_PASS: ""
      CUBEJS_API_SECRET: ${CUBE_API_SECRET:-change_me_in_production}
      CUBEJS_LOG_LEVEL: warn
    volumes:
      - ./cube:/cube/conf
    networks:
      - platform-net
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/readyz').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  # --------------------------------------------------------------------------
  # PostgreSQL — Airflow Metadata Database
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:alpine
    container_name: platform-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - platform-net
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Apache Airflow — Workflow Orchestration Engine (LocalExecutor)
  # --------------------------------------------------------------------------
  airflow:
    build:
      context: .
      dockerfile: infra/airflow/Dockerfile
    image: crypto-platform-airflow:latest
    container_name: platform-airflow
    command: standalone
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8085:8080"   # Airflow Webserver (Host 8085)
    environment: *airflow-env
    volumes:
      - .:/opt/airflow/app
      - ./src/orchestration/dags:/opt/airflow/dags
      - ./dbt:/opt/airflow/dbt
    networks:
      - platform-net
    mem_limit: 2048m
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # --------------------------------------------------------------------------
  # Phase 7: Observability Stack (Activated via --profile observability)
  # --------------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:latest
    container_name: platform-prometheus
    profiles: [observability]
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./infra/observability/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    networks:
      - platform-net
    mem_limit: 256m
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: platform-grafana
    profiles: [observability]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/observability/grafana/dashboards:/etc/grafana/dashboards
      - grafana_data:/var/lib/grafana
    networks:
      - platform-net
    mem_limit: 128m
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: platform-loki
    profiles: [observability]
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./infra/observability/loki/loki-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    networks:
      - platform-net
    mem_limit: 192m
    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest
    container_name: platform-alloy
    profiles: [observability]
    ports:
      - "12345:12345"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./infra/observability/alloy/config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - platform-net
    mem_limit: 128m
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: platform-alertmanager
    profiles: [observability]
    ports:
      - "9093:9093"
    command: --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./infra/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    networks:
      - platform-net
    mem_limit: 64m
    restart: unless-stopped

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: platform-kafka-exporter
    profiles: [observability]
    ports:
      - "9308:9308"
    command:
      - --kafka.server=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - platform-net
    mem_limit: 64m
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: platform-cadvisor
    profiles: [observability]
    ports:
      - "8083:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    networks:
      - platform-net
    mem_limit: 128m
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: platform-node-exporter
    profiles: [observability]
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
    networks:
      - platform-net
    mem_limit: 32m
    restart: unless-stopped

  statsd-exporter:
    image: prom/statsd-exporter:latest
    container_name: platform-statsd-exporter
    profiles: [observability]
    ports:
      - "9102:9102"
      - "8125:8125/udp"
    networks:
      - platform-net
    mem_limit: 32m
    restart: unless-stopped

# ------------------------------------------------------------------------------
# Named volumes — persist data across compose up/down cycles
# ------------------------------------------------------------------------------
volumes:
  kafka_data:
    driver: local
  minio_data:
    driver: local
  clickhouse_data:
    driver: local
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local

# ------------------------------------------------------------------------------
# Shared network
# ------------------------------------------------------------------------------
networks:
  platform-net:
    driver: bridge
