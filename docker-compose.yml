# Crypto platform — Phase 1–3 Docker Compose stack.
#
# Services:
#   kafka         - Apache Kafka (KRaft mode, no ZooKeeper)  apache/kafka:latest
#   kafka-ui      - Provectus Kafka UI  http://localhost:8080
#   minio         - MinIO S3-compatible object storage  http://localhost:9001
#   mc-init       - One-shot init: creates bronze / silver / gold buckets
#   clickhouse    - ClickHouse OLAP engine  http://localhost:8123
#
# Usage:
#   docker compose up -d
#   docker compose stop kafka-ui   # free RAM when not needed

services:

  # --------------------------------------------------------------------------
  # Apache Kafka — KRaft mode, single combined broker/controller node
  # --------------------------------------------------------------------------
  kafka:
    image: apache/kafka:latest
    container_name: platform-kafka
    hostname: kafka
    ports:
      - "9094:9094"   # EXTERNAL listener — host access
    environment:
      # Node identity
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"

      # Cluster ID (stable UUID — regenerate with kafka-storage.sh random-uuid)
      CLUSTER_ID: "WkdnTb4jQ3aO-0B24ZvsMQ"

      # Controller quorum
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      # Listeners: INTERNAL (docker) + EXTERNAL (host) + CONTROLLER
      KAFKA_LISTENERS: "INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"

      # JVM heap — capped for 7-8 GB usable RAM machine
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"

      # Topic defaults
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"

      # Retention — 24 h keeps disk usage manageable during dev
      KAFKA_LOG_RETENTION_HOURS: "24"
      KAFKA_LOG_SEGMENT_BYTES: "268435456"   # 256 MB segments

    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - platform-net
    healthcheck:
      test:
        - "CMD-SHELL"
        - "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Kafka UI — lightweight broker observability
  # --------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: platform-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - platform-net
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # MinIO — S3-compatible local lake storage
  # --------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: platform-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Admin console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - platform-net
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "-f"
        - "http://localhost:9000/minio/health/live"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # mc-init — one-shot MinIO Client that creates the medallion buckets
  # --------------------------------------------------------------------------
  mc-init:
    image: minio/mc:latest
    container_name: platform-mc-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/bronze &&
        mc mb --ignore-existing local/silver &&
        mc mb --ignore-existing local/gold &&
        echo 'Buckets ready: bronze, silver, gold' &&
        exit 0
      "
    networks:
      - platform-net

  # --------------------------------------------------------------------------
  # ClickHouse — columnar OLAP engine
  # --------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:head-alpine
    container_name: platform-clickhouse
    ports:
      - "8123:8123"   # HTTP interface (clickhouse-connect, dbt)
      - "9009:9009"   # Native TCP (ClickHouse-to-ClickHouse replication)
    environment:
      CLICKHOUSE_DB: gold
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/config.d/custom-config.xml:/etc/clickhouse-server/config.d/custom-config.xml
      - ./infra/clickhouse/users.d/custom-users.xml:/etc/clickhouse-server/users.d/custom-users.xml
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    mem_limit: 2048m
    networks:
      - platform-net
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Cube — Semantic Layer
  # --------------------------------------------------------------------------
  cube:
    image: cubejs/cube:latest
    container_name: platform-cube
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "4000:4000"   # REST API + Playground UI
      - "15432:15432" # SQL API (Postgres wire protocol)
    environment:
      CUBEJS_DEV_MODE: "true"
      CUBEJS_DB_TYPE: clickhouse
      CUBEJS_DB_HOST: clickhouse
      CUBEJS_DB_PORT: "8123"
      CUBEJS_DB_NAME: gold
      CUBEJS_DB_USER: default
      CUBEJS_DB_PASS: ""
      CUBEJS_API_SECRET: ${CUBE_API_SECRET:-change_me_in_production}
      CUBEJS_LOG_LEVEL: warn
    volumes:
      - ./cube:/cube/conf
    networks:
      - platform-net
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/readyz"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

# ------------------------------------------------------------------------------
# Named volumes — persist data across compose up/down cycles
# ------------------------------------------------------------------------------
volumes:
  kafka_data:
    driver: local
  minio_data:
    driver: local
  clickhouse_data:
    driver: local

# ------------------------------------------------------------------------------
# Shared network
# ------------------------------------------------------------------------------
networks:
  platform-net:
    driver: bridge
