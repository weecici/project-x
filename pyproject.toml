[project]
name = "crypto-platform"
version = "0.1.0"
description = "End-to-end crypto analytics platform: live + batch ingestion, lakehouse, OLAP, and ML serving"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "apache-airflow>=3.3.0",
  "apache-airflow-providers-fab>=2.4.2",
  "apache-airflow-providers-openlineage>=2.19.0",
  "asyncpg>=0.31.0",
  "boto3>=1.43.65",
  "clickhouse-connect>=0.8.0",
  "confluent-kafka>=2.15.0",
  "dbt-clickhouse>=1.10.1",
  "gspread>=6.2.1",
  "httpx>=0.28.0",
  "loguru>=0.7.3",
  "mlflow>=2.15.0",
  "mypy-boto3-s3>=1.43.31",
  "numba>=0.61.2",
  "nvidia-ml-py>=13.610.43",
  "onnx>=1.22.0",
  "openlineage-python>=1.51.0",
  "pandas>=2.2.0,<3.0.0",
  "pandas-ta>=0.4.71b0",
  "psutil>=7.2.2",
  "psycopg2-binary>=2.9.12",
  "pyarrow>=15.0.0,<20.0.0",
  "pydantic>=2",
  "pydantic-settings>=2.14.2",
  "pyspark>=3.5.0",
  "rich>=15.0.0",
  "scikit-learn>=1.9.0",
  "statsd>=4.0.1",
  "tenacity>=9.1.4",
  "torch>=2.5.0",
  "torchvision>=0.20.0",
  "websockets>=16.0",
]

[project.scripts]
produce      = "ingestion.run_producer:cli"
write-lake   = "ingestion.run_lake_writer:cli"
backfill     = "batch.run_backfill:cli"
silver       = "batch.run_silver:cli"
load-olap    = "olap.loader:cli"
stream-ohlcv = "streaming.run_ohlcv:cli"
stream-vwap  = "streaming.run_vwap:cli"
export-bi    = "olap.exporter:cli"
export-lineage = "orchestration.governance.run_lineage:cli"
feature-eng  = "ml.features.run_feature_eng:main"
train-model  = "ml.training.run_train:main"
optimize-model = "ml.optimization.run_optimize:main"


[dependency-groups]
dev = [
  "boto3-stubs[s3]>=1.43.40",
  "mypy>=2.1.0",
  "pre-commit>=4.6.0",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "pytest-httpx>=0.35.0",
  "ruff>=0.15.20",
  "testcontainers[clickhouse,kafka,minio]>=4.14.2",
]
docs = [
    "mkdocs-material>=9.7.6",
    "mkdocstrings>=1.0.4",
    "mkdocstrings-python>=2.0.5",
    "pymdown-extensions>=11.0.1",
]

[build-system]
requires = ["uv_build>=0.11.27,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
namespace = true

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing -v"
markers = [
  "e2e: end-to-end tests; require full docker compose stack (docker compose up -d)",
  "integration: integration tests; require Docker daemon",
]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN", "RUF", "B", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
