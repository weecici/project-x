[project]
name = "crypto-platform"
version = "0.1.0"
description = "End-to-end crypto analytics platform: live + batch ingestion, lakehouse, OLAP, and ML serving"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "boto3>=1.43.40",
  "confluent-kafka>=2.15.0",
  "loguru>=0.7.3",
  "pyarrow>=24.0.0",
  "pydantic>=2",
  "pydantic-settings>=2.14.2",
  "rich>=15.0.0",
  "tenacity>=9.1.4",
  "websockets>=16.0",
]

[project.scripts]
produce = "ingestion.run_producer:cli"
write-lake = "ingestion.run_lake_writer:cli"

[dependency-groups]
dev = [
  "boto3-stubs[s3]>=1.43.40",
  "mypy>=2.1.0",
  "pre-commit>=4.6.0",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.15.20",
  "testcontainers[kafka,minio]>=4.14.2",
]

[build-system]
requires = ["uv_build>=0.11.27,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
namespace = true

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=ingestion --cov-report=term-missing -v"
markers = [
  "e2e: end-to-end tests; require full docker compose stack (docker compose up -d)",
  "integration: integration tests; require Docker daemon",
]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN", "RUF", "B", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
